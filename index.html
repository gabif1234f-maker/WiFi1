<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFiVault - Registro Seguro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout">
        <!-- Barra de navegación superior -->
        <div class="top-nav">
            <div class="nav-brand">
                <span class="brand-icon">⚡</span>
                <h1>WiFi<strong>Vault</strong></h1>
            </div>
            <a href="registros.html" class="btn-nav">
                <span>📋</span> Gestionar Base de Datos
            </a>
        </div>

        <!-- Tarjeta del Formulario -->
        <div class="main-card">
            <div class="card-header">
                <h2>Registrar Nueva Conexión</h2>
                <p>Ingresa las credenciales y la ubicación del cliente de forma centralizada.</p>
            </div>
            
            <form id="wifiForm" class="modern-form">
                
                <!-- SECCIÓN: DATOS DEL CLIENTE -->
                <div class="form-section">
                    <h3 class="section-title">Datos del Cliente</h3>
                    
                    <div class="form-group">
                        <label for="nombreCliente">Nombre Completo o Razón Social</label>
                        <input type="text" id="nombreCliente" placeholder="Ej. Juan Carlos Pérez o Farmacia Pampa" required>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="localidad">Localidad</label>
                            <select id="localidad" required>
                                <option value="Pampa del Infierno, Chaco" selected>Pampa del Infierno, Chaco</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="barrio">Barrio</label>
                            <select id="barrio" required>
                                <option value="" disabled selected>Selecciona...</option>
                                <option value="Centro">Barrio Centro</option>
                                <option value="Aviación">Barrio Aviación</option>
                                <option value="San Cayetano">Barrio San Cayetano</option>
                                <option value="Primavera">Barrio Primavera</option>
                                <option value="Otro">Otro / Zona Rural</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-grid">
                        <div class="form-group">
                            <label for="calle">Calle</label>
                            <select id="calle" required disabled>
                                <option value="" disabled selected>Elige un barrio primero...</option>
                            </select>
                            <input type="text" id="calleManual" placeholder="Escribe la calle manualmente..." style="display: none; margin-top: 8px;">
                        </div>

                        <div class="form-group" style="max-width: 150px;">
                            <label for="altura">Altura / N°</label>
                            <input type="text" id="altura" placeholder="Ej. 450 o S/N" required>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN: CONFIGURACIÓN DE RED -->
                <div class="form-section">
                    <h3 class="section-title">Configuración de Conexión</h3>
                    
                    <div class="form-group">
                        <label for="nombreRed">Nombre de la Red (SSID)</label>
                        <input type="text" id="nombreRed" placeholder="Ej. WiFi_Casa_Perez" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña de Red WiFi</label>
                        <input type="text" id="password" class="password-field" placeholder="Ej. P@ssw0rd2026!" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Almacenar Credenciales en Servidor</button>
            </form>
        </div>
    </div>

<script type="module">
    // Importa los módulos de Firebase desde el CDN oficial
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, addDoc } from "https://gstatic.com";

    // REEMPLAZA ESTOS DATOS CON LOS DE TU CONSOLA DE FIREBASE
    const firebaseConfig = {
        apiKey: "TUS_DATOS_AQUI",
        authDomain: "://firebaseapp.com",
        projectId: "tu-proyecto",
        storageBucket: "://appspot.com",
        messagingSenderId: "ID_AQUI",
        appId: "APP_ID_AQUI"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    var callesPorBarrio = {
        "Centro": ["Av. 25 de Mayo", "Av. San Martín", "Calle Rivadavia", "Calle Belgrano", "Calle Sarmiento"],
        "Aviación": ["Calle Jorge Newbery", "Calle Almandos Almonacid", "Calle Fuerza Aérea", "Calle Los Inmigrantes"],
        "San Cayetano": ["Calle San Cayetano", "Calle Padre Grote", "Calle San Martín Prolongación"],
        "Primavera": ["Calle 21 de Septiembre", "Calle Las Flores", "Calle El Ceibo", "Calle Los Lapachos"]
    };

    var selectBarrio = document.getElementById('barrio');
    var selectCalle = document.getElementById('calle');
    var inputCalleManual = document.getElementById('calleManual');

    selectBarrio.onchange = function() {
        var barrioSeleccionado = this.value;
        selectCalle.innerHTML = '<option value="" disabled selected>Selecciona una calle...</option>';
        
        if (barrioSeleccionado === "Otro" || !callesPorBarrio[barrioSeleccionado]) {
            selectCalle.style.display = "none";
            selectCalle.required = false;
            inputCalleManual.style.display = "block";
            inputCalleManual.required = true;
            inputCalleManual.value = "";
        } else {
            selectCalle.style.display = "block";
            selectCalle.required = true;
            selectCalle.disabled = false;
            inputCalleManual.style.display = "none";
            inputCalleManual.required = false;

            var calles = callesPorBarrio[barrioSeleccionado];
            calles.forEach(function(calle) {
                var opcion = document.createElement('option');
                opcion.value = calle;
                opcion.textContent = calle;
                selectCalle.appendChild(opcion);
            });
        }
    };

    document.getElementById('wifiForm').onsubmit = async function(e) {
        e.preventDefault();
        
        var calleFinal = selectCalle.style.display === "none" ? inputCalleManual.value.trim() : selectCalle.value;
        var barrioFinal = selectBarrio.value;
        var alturaFinal = document.getElementById('altura').value.trim();
        var localidadFinal = document.getElementById('localidad').value;
        var direccionCompleta = calleFinal + " " + alturaFinal + " (B° " + barrioFinal + "), " + localidadFinal;
        
        try {
            // Guarda directo en la colección "redes_wifi" de Firestore
            await addDoc(collection(db, "redes_wifi"), {
                nombre: document.getElementById('nombreCliente').value.trim(),
                ubicacion: direccionCompleta,
                red: document.getElementById('nombreRed').value.trim(),
                password: document.getElementById('password').value,
                timestamp: Date.now()
            });
            
            alert("¡Registro guardado en la nube con éxito!");
            document.getElementById('wifiForm').reset();
            window.location.href = "registros.html";
        } catch (error) {
            console.error("Error al guardar: ", error);
            alert("Hubo un error al almacenar los datos en Firebase.");
        }
    };
</script>

</body>
</html>
