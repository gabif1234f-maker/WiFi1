<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFiVault - Base de Datos Interactiva</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-layout large-layout">
        <!-- Barra de navegación superior -->
        <div class="top-nav">
            <div class="nav-brand">
                <span class="brand-icon">📊</span>
                <h1>WiFi<strong>Vault</strong> <span class="counter-badge" id="totalCounter">0 Redes</span></h1>
            </div>
            <a href="index.html" class="btn-nav btn-nav-accent">
                <span>➕</span> Nuevo Registro
            </a>
        </div>

        <!-- Tabla y Controles -->
        <div class="main-card">
            <div class="controls-toolbar">
                <div class="search-wrapper">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="inputBuscar" class="search-input" placeholder="Buscar cliente, calle o barrio...">
                </div>
                <button id="btnExportar" class="btn-excel">
                    <span>📥</span> Exportar Planilla (.CSV)
                </button>
            </div>

            <div class="table-responsive">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Cliente</th>
                            <th>Dirección Asignada</th>
                            <th>Red (SSID)</th>
                            <th>Contraseña de Seguridad</th>
                            <th style="text-align: center; width: 150px;">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes">
                        <!-- Estructurado dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

 <script type="module">
    import { initializeApp } from "https://gstatic.com";
    import { getFirestore, collection, getDocs, doc, updateDoc, deleteDoc } from "https://gstatic.com";

    // USA LOS MISMOS DATOS DE CONFIGURACIÓN AQUÍ
    const firebaseConfig = {
        apiKey: "TUS_DATOS_AQUI",
        authDomain: "://firebaseapp.com",
        projectId: "tu-proyecto",
        storageBucket: "://appspot.com",
        messagingSenderId: "ID_AQUI",
        appId: "APP_ID_AQUI"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    function actualizarContador(total) {
        document.getElementById('totalCounter').innerText = total + (total === 1 ? " Red" : " Redes");
    }

    window.copiarContrasena = function(texto, elemento) {
        navigator.clipboard.writeText(texto).then(function() {
            elemento.innerText = "✅";
            setTimeout(function() { elemento.innerText = "📋"; }, 1500);
        });
    }

    async function mostrarRegistros(filtro = "") {
        var tablaBody = document.getElementById('tablaClientes');
        if (!tablaBody) return;
        tablaBody.innerHTML = '<tr><td colspan="5" class="empty-msg">Cargando datos desde la nube...</td></tr>';

        try {
            const querySnapshot = await getDocs(collection(db, "redes_wifi"));
            let listaClientes = [];
            querySnapshot.forEach((docSnap) => {
                listaClientes.push({ id: docSnap.id, ...docSnap.data() });
            });

            actualizarContador(listaClientes.length);
            tablaBody.innerHTML = "";

            var listaFiltrada = listaClientes.filter(function(cliente) {
                return cliente.nombre.toLowerCase().includes(filtro.toLowerCase()) || 
                       cliente.ubicacion.toLowerCase().includes(filtro.toLowerCase());
            });

            if (listaFiltrada.length === 0) {
                tablaBody.innerHTML = '<tr><td colspan="5" class="empty-msg">No se encontraron terminales registradas.</td></tr>';
                return;
            }

            listaFiltrada.forEach(function(cliente) {
                var fila = document.createElement('tr');
                fila.innerHTML = `
                    <td><div class="client-name" id="label-nombre-${cliente.id}">${cliente.nombre}</div></td>
                    <td><div class="address-text" id="label-ubicacion-${cliente.id}">${cliente.ubicacion}</div></td>
                    <td><span class="badge-ssid" id="label-red-${cliente.id}">${cliente.red}</span></td>
                    <td>
                        <div class="password-container-row">
                            <span class="crypto-password" id="label-password-${cliente.id}">${cliente.password}</span>
                            <button class="btn-copy" onclick="copiarContrasena('${cliente.password}', this)" title="Copiar">📋</button>
                        </div>
                    </td>
                    <td style="text-align: center;">
                        <div class="actions-container-row">
                            <button class="btn-edit" id="btn-edit-${cliente.id}" onclick="activarEdicion('${cliente.id}')">⚙️</button>
                            <button class="btn-delete" onclick="eliminarRegistro('${cliente.id}')">❌</button>
                        </div>
                    </td>
                `;
                tablaBody.appendChild(fila);
            });
        } catch (error) {
            console.error("Error al cargar registros: ", error);
            tablaBody.innerHTML = '<tr><td colspan="5" class="empty-msg">Error al conectar con Firebase.</td></tr>';
        }
    }

    window.activarEdicion = function(id) {
        var lblNombre = document.getElementById('label-nombre-' + id);
        var lblUbicacion = document.getElementById('label-ubicacion-' + id);
        var lblRed = document.getElementById('label-red-' + id);
        var lblPassword = document.getElementById('label-password-' + id);
        var btnEdit = document.getElementById('btn-edit-' + id);

        lblNombre.innerHTML = `<input type="text" class="table-input" id="edit-nombre-${id}" value="${lblNombre.innerText}">`;
        lblUbicacion.innerHTML = `<input type="text" class="table-input" id="edit-ubicacion-${id}" value="${lblUbicacion.innerText}">`;
        lblRed.innerHTML = `<input type="text" class="table-input" id="edit-red-${id}" value="${lblRed.innerText}">`;
        
        var parentPass = lblPassword.parentElement;
        parentPass.innerHTML = `<span class="crypto-password"><input type="text" class="table-input password-field" id="edit-password-${id}" value="${lblPassword.innerText}"></span>`;

        btnEdit.textContent = "💾";
        btnEdit.className = "btn-save-inline";
        btnEdit.onclick = function() { guardarEdicion(id); };
    }

    window.guardarEdicion = async function(id) {
        var valNombre = document.getElementById('edit-nombre-' + id).value.trim();
        var valUbicacion = document.getElementById('edit-ubicacion-' + id).value.trim();
        var valRed = document.getElementById('edit-red-' + id).value.trim();
        var valPassword = document.getElementById('edit-password-' + id).value;

        if (!valNombre || !valUbicacion || !valRed || !valPassword) {
            alert("Ningún campo puede quedar vacío.");
            return;
        }

        try {
            await updateDoc(doc(db, "redes_wifi", id), {
                nombre: valNombre,
                ubicacion: valUbicacion,
                red: valRed,
                password: valPassword
            });
            alert("Registro modificado en la nube.");
            mostrarRegistros(document.getElementById('inputBuscar').value);
        } catch (error) {
            console.error("Error al actualizar: ", error);
            alert("No se pudo actualizar el registro.");
        }
    }

    window.eliminarRegistro = async function(id) {
        if (confirm("¿Deseas purgar de forma permanente este registro de la nube?")) {
            try {
                await deleteDoc(doc(db, "redes_wifi", id));
                mostrarRegistros(document.getElementById('inputBuscar').value);
            } catch (error) {
                console.error("Error al borrar: ", error);
                alert("No se pudo eliminar el registro.");
            }
        }
    }

    document.getElementById('inputBuscar').oninput = function() {
        mostrarRegistros(this.value);
    };

    document.addEventListener('DOMContentLoaded', function() {
        mostrarRegistros();
    });
</script>

</body>
</html>
